syntax = "proto3";

package changelog;

// A blind relay for client-encrypted document write events: the server only
// ever stores and forwards opaque bytes, and cannot read them.
service Changelog {
  // Submits a new, already-encrypted event. Returns its assigned offset.
  rpc RecordEvent(RecordEventRequest) returns (RecordEventResponse);

  // Streams every entry recorded from `offset` onward, oldest first,
  // replaying persisted history before continuing with new entries as
  // they're recorded (a single call covers both catch-up and live tail). An
  // `offset` of 0 means "from the beginning of the changelog".
  rpc ConsumeSince(ConsumeSinceRequest) returns (stream ChangelogEvent);
}

message RecordEventRequest {
  // Opaque, client-encrypted event payload the server cannot read: a
  // wrapped data-encryption-key followed by the AES-256-GCM-encrypted,
  // MessagePack-serialized event.
  bytes encrypted_content = 1;
}

message RecordEventResponse {
  int64 offset = 1;
}

message ConsumeSinceRequest {
  int64 offset = 1;
}

message ChangelogEvent {
  int64 offset = 1;
  // See RecordEventRequest.encrypted_content.
  bytes encrypted_content = 2;
}
