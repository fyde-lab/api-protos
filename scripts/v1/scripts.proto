syntax = "proto3";

package scripts.v1;

// Manages user-authored scripts: creating them, fetching them by id, and
// enabling/disabling them for the authenticated user. Unlike Documents,
// script content is not treated as an opaque encrypted blob by the server —
// scripts can be marked public and shared between users.
service ScriptsService {
  // Creates a new script owned by the authenticated user, at version 1.
  rpc CreateScript(CreateScriptRequest) returns (CreateScriptResponse);

  // Fetches the script matching `id`. Fails with NOT_FOUND if it doesn't
  // exist.
  rpc FetchScript(FetchScriptRequest) returns (FetchScriptResponse);

  // Enables `script_id` for the authenticated user. Enabling an
  // already-enabled script is a no-op.
  rpc EnableScript(EnableScriptRequest) returns (EnableScriptResponse);

  // Disables `script_id` for the authenticated user. Disabling a script
  // that isn't enabled is a no-op.
  rpc DisableScript(DisableScriptRequest) returns (DisableScriptResponse);

  // Updates a script owned by the authenticated user, incrementing its
  // version. Fails with NOT_FOUND if the script doesn't exist, and
  // PERMISSION_DENIED if the authenticated user isn't its owner.
  rpc UpdateScript(UpdateScriptRequest) returns (UpdateScriptResponse);

  // Lists the scripts currently enabled for the authenticated user.
  rpc ListUserScripts(ListUserScriptsRequest) returns (ListUserScriptsResponse);

  // Lists every script marked public, regardless of who owns it or whether
  // the authenticated user has it enabled.
  rpc ListPublicScripts(ListPublicScriptsRequest) returns (ListPublicScriptsResponse);
}

message Script {
  // Canonical string form of a UUIDv7, assigned by the server.
  string id = 1;
  string name = 2;
  bool is_public = 3;
  // Optional icon image, opaque to the server.
  bytes icon = 4;
  uint64 version = 5;
  string script = 6;
  // Unix timestamp, in seconds, of the last time this script was updated.
  int64 last_updated = 7;
  // The script's own description, written by its author for display in a
  // marketplace listing.
  string description = 8;
  // A one-line summary, shorter than `description`, for display where
  // space is limited (e.g. a marketplace list row).
  string short_description = 9;
  // A marketplace banner/logo image, distinct from `icon`.
  bytes logo = 10;
}

message CreateScriptRequest {
  string name = 1;
  bool is_public = 2;
  bytes icon = 3;
  string script = 4;
  string description = 5;
  string short_description = 6;
  bytes logo = 7;
}

message CreateScriptResponse {
  Script script = 1;
}

message FetchScriptRequest {
  // Canonical string form of a UUIDv7.
  string id = 1;
}

message FetchScriptResponse {
  Script script = 1;
}

message EnableScriptRequest {
  // Canonical string form of a UUIDv7.
  string script_id = 1;
}

message EnableScriptResponse {}

message DisableScriptRequest {
  // Canonical string form of a UUIDv7.
  string script_id = 1;
}

message DisableScriptResponse {}

message UpdateScriptRequest {
  // Canonical string form of a UUIDv7.
  string id = 1;
  string name = 2;
  bool is_public = 3;
  bytes icon = 4;
  string script = 5;
  string description = 6;
  string short_description = 7;
  bytes logo = 8;
}

message UpdateScriptResponse {
  Script script = 1;
}

message ListUserScriptsRequest {}

message ListUserScriptsResponse {
  repeated Script scripts = 1;
}

message ListPublicScriptsRequest {}

message ListPublicScriptsResponse {
  repeated Script scripts = 1;
}
