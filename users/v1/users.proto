syntax = "proto3";

package users.v1;

// Manages storage and authentication of user accounts using the OPAQUE
// asymmetric password-authenticated key exchange protocol (RFC 9807). The
// server never receives a plaintext password or anything equivalent to it
// (like a traditional password hash): every `opaque_*` field below is an
// opaque protocol message produced by an OPAQUE implementation on one side
// and consumed by the matching implementation on the other, generated
// against a fixed ciphersuite both sides must agree on out of band.
// Registration and login are each a two-step exchange, split across two
// RPCs, because OPAQUE requires a response from the other party before the
// final message can be computed.
service UsersService {
  // First step of registering a new account: the client sends an OPAQUE
  // registration request derived from the chosen password via an oblivious
  // PRF, and the server responds with a registration response. Stateless on
  // the server — nothing is persisted or correlated between this call and
  // `FinishRegistration` — and reveals nothing about whether `username` is
  // already taken.
  rpc StartRegistration(StartRegistrationRequest) returns (StartRegistrationResponse);

  // Second and final step of registration: the client sends the OPAQUE
  // registration record derived from the previous response, which the
  // server persists in place of a password hash, and opens a new session
  // for the device named `device_name`. Fails with ALREADY_EXISTS if the
  // username is already taken.
  rpc FinishRegistration(FinishRegistrationRequest) returns (FinishRegistrationResponse);

  // First step of logging in: the client sends an OPAQUE credential
  // request, and the server responds with a credential response plus a
  // `login_id` correlating this call with the `FinishLogin` call that
  // completes the exchange. The response is indistinguishable whether or
  // not `username` is registered, so this step alone can't be used to
  // enumerate registered usernames.
  rpc StartLogin(StartLoginRequest) returns (StartLoginResponse);

  // Second and final step of logging in: the client sends the OPAQUE
  // credential finalization message proving knowledge of the password for
  // the exchange identified by `login_id`, and opens a new session for the
  // device named `device_name` if it checks out. Fails with UNAUTHENTICATED
  // if the credentials are invalid or `login_id` is unknown (e.g. already
  // used, or `StartLogin` was never called).
  //
  // Each account's plan bounds how many sessions it may have open at once.
  // If the credentials check out but the account is already at that limit,
  // no session is opened and the response carries `session_limit_reached`
  // instead, listing the account's open sessions. To log in anyway, the
  // client picks one of them and runs the whole login again (`StartLogin`
  // then `FinishLogin`, since `login_id` is single-use) with
  // `replace_session_id` set to it: the server closes that session and opens
  // the new one in its place, atomically.
  rpc FinishLogin(FinishLoginRequest) returns (FinishLoginResponse);

  // Closes the session identified by the bearer token carried in the
  // call's `authorization` metadata. Fails with UNAUTHENTICATED if it
  // doesn't match an active session.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // First step of changing the password of the account behind the current
  // session: like StartRegistration, but for an account that already
  // exists. The client sends an OPAQUE registration request derived from
  // the new password, and the server responds with a registration
  // response. Requires an active session, identified by the bearer token
  // carried in the call's `authorization` metadata — the account to change
  // is derived from that session, not from a username field.
  rpc StartChangePassword(StartChangePasswordRequest) returns (StartChangePasswordResponse);

  // Second and final step of changing password: the client sends the
  // OPAQUE registration record derived from the new password, which the
  // server persists in place of the account's previous record, alongside
  // the master key re-encrypted client-side under a key derived from the
  // new password's OPAQUE export key. Requires an active session, same as
  // StartChangePassword.
  rpc FinishChangePassword(FinishChangePasswordRequest) returns (FinishChangePasswordResponse);
}

// A user account's privilege level. The very first account ever
// registered on a server is promoted to ROLE_ADMIN; every account after
// that defaults to ROLE_USER.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ADMIN = 2;
}

message StartRegistrationRequest {
  string username = 1;
  // Serialized OPAQUE `RegistrationRequest` message.
  bytes opaque_request = 2;
}

message StartRegistrationResponse {
  // Serialized OPAQUE `RegistrationResponse` message.
  bytes opaque_response = 1;
}

message FinishRegistrationRequest {
  string username = 1;
  // Serialized OPAQUE `RegistrationUpload` message, which the server turns
  // into the registration record it persists for this account in place of
  // a password hash.
  bytes opaque_upload = 2;
  // Human-readable name of the device opening the session (e.g. "Pierre's
  // iPhone"), chosen by the SDK/caller.
  string device_name = 3;
  // The user's master key, encrypted client-side under a key derived from
  // the OPAQUE export key. Opaque to the server: only ever stored and
  // returned as ciphertext, never inspected.
  bytes encrypted_master_key = 4;
  // The user's preferred interface language (e.g. "en", "fr"), chosen by
  // the SDK/caller. Not opaque to the server: stored and returned as-is,
  // unlike the encrypted fields above.
  string language = 5;
}

message StartLoginRequest {
  string username = 1;
  // Serialized OPAQUE `CredentialRequest` message.
  bytes opaque_request = 2;
}

message StartLoginResponse {
  // Opaque handle correlating this call with the `FinishLogin` call that
  // completes the exchange. Carries no information about whether
  // `username` exists.
  string login_id = 1;
  // Serialized OPAQUE `CredentialResponse` message.
  bytes opaque_response = 2;
}

message FinishLoginRequest {
  // The `login_id` returned by the matching `StartLogin` call.
  string login_id = 1;
  // Serialized OPAQUE `CredentialFinalization` message.
  bytes opaque_upload = 2;
  // Human-readable name of the device opening the session, chosen by the
  // SDK/caller.
  string device_name = 3;
  // Optional. The `id` of one of the account's open sessions (as listed by
  // a previous `session_limit_reached` response) to close in favor of the
  // new one. Fails with NOT_FOUND if it doesn't name an open session of the
  // authenticated account. Leave empty for a regular login.
  string replace_session_id = 4;
}

message FinishRegistrationResponse {
  // Opaque session token. The device must present it as a `Bearer` token
  // in the `authorization` metadata of subsequent authenticated calls.
  string session_token = 1;
  // The user's master key, encrypted client-side under a key derived from
  // the OPAQUE export key (see `FinishRegistrationRequest.encrypted_master_key`).
  // Opaque to the server: returned as-is, never inspected. Lets a device
  // that logs into an existing account (as opposed to registering a new
  // one) recover the same master key `FinishRegistration` originally
  // persisted, by unwrapping this under the export key its own OPAQUE
  // login exchange produces.
  bytes encrypted_master_key = 2;
  // The newly created account's role. Always ROLE_ADMIN for the very
  // first account ever registered on the server, ROLE_USER otherwise.
  Role role = 3;
}

message FinishLoginResponse {
  oneof result {
    // The credentials checked out and a new session was opened.
    LoginSucceeded succeeded = 1;
    // The credentials checked out, but the account already has as many
    // open sessions as its plan allows: no session was opened (and none was
    // closed, even if `replace_session_id` was set).
    SessionLimitReached session_limit_reached = 2;
  }
}

message LoginSucceeded {
  // Opaque session token. The device must present it as a `Bearer` token
  // in the `authorization` metadata of subsequent authenticated calls.
  string session_token = 1;
  // The user's master key, encrypted client-side under a key derived from
  // the OPAQUE export key (see `FinishRegistrationRequest.encrypted_master_key`).
  // Opaque to the server: returned as-is, never inspected. Lets a device
  // that logs into an existing account (as opposed to registering a new
  // one) recover the same master key `FinishRegistration` originally
  // persisted, by unwrapping this under the export key its own OPAQUE
  // login exchange produces.
  bytes encrypted_master_key = 2;
  // The authenticated account's role.
  Role role = 3;
}

message SessionLimitReached {
  // The most sessions the account's plan allows it to have open at once.
  uint32 max_sessions = 1;
  // Every session the account currently has open, oldest first. Pass one's
  // `id` as `FinishLoginRequest.replace_session_id` to close it in favor of
  // the new one.
  repeated SessionInfo sessions = 2;
}

// A session (a device logged into an account), as listed to the account's
// own user. Never carries the session's token.
message SessionInfo {
  string id = 1;
  // Human-readable name of the device, as given when the session was opened.
  string device_name = 2;
  // Unix timestamp, in seconds, of when the session was opened.
  int64 created_at = 3;
}

message LogoutRequest {}

message LogoutResponse {}

message StartChangePasswordRequest {
  // Serialized OPAQUE `RegistrationRequest` message, derived from the new
  // password.
  bytes opaque_request = 1;
}

message StartChangePasswordResponse {
  // Serialized OPAQUE `RegistrationResponse` message.
  bytes opaque_response = 1;
}

message FinishChangePasswordRequest {
  // Serialized OPAQUE `RegistrationUpload` message, which the server turns
  // into the registration record it persists in place of the account's
  // previous one.
  bytes opaque_upload = 1;
  // The user's master key, re-encrypted client-side under a key derived
  // from the new password's OPAQUE export key. Opaque to the server: only
  // ever stored and returned as ciphertext, never inspected.
  bytes encrypted_master_key = 2;
}

message FinishChangePasswordResponse {}
