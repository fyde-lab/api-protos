syntax = "proto3";

package changelog.v1;

// A blind relay for client-encrypted document write events: the server only
// ever stores and forwards opaque bytes, and cannot read them.
service ChangelogService {
  // Submits a new, already-encrypted event. Returns its assigned id.
  rpc RecordEvent(RecordEventRequest) returns (RecordEventResponse);

  // Streams every entry recorded from `id` onward, oldest first, replaying
  // persisted history before continuing with new entries as they're
  // recorded (a single call covers both catch-up and live tail). An empty
  // `id` means "from the beginning of the changelog".
  rpc ConsumeSince(ConsumeSinceRequest) returns (stream ConsumeSinceResponse);
}

message RecordEventRequest {
  // Opaque, client-encrypted event payload the server cannot read: a
  // wrapped data-encryption-key followed by the AES-256-GCM-encrypted,
  // MessagePack-serialized event.
  bytes encrypted_content = 1;
}

message RecordEventResponse {
  // Canonical string form of a UUIDv7 (or another strictly time-ordered
  // id), assigned by the server. Entries must sort by id in the same order
  // they were recorded, so clients can rely on id order as chronological
  // order.
  string id = 1;
  // Canonical string form of the id of the entry immediately preceding this
  // one *for the same user*, or empty if this is the first entry that user
  // ever recorded. Lets clients detect a gap in that user's entries (a
  // previous_id that doesn't match the last entry id they saw for that
  // user) meaning an entry was skipped.
  string previous_id = 2;
}

message ConsumeSinceRequest {
  // Canonical string form of a UUIDv7, or empty for "from the beginning".
  string id = 1;
}

message ConsumeSinceResponse {
  // See RecordEventResponse.id.
  string id = 1;
  // See RecordEventRequest.encrypted_content.
  bytes encrypted_content = 2;
  // See RecordEventResponse.previous_id.
  string previous_id = 3;
}
