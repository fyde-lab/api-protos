syntax = "proto3";

package users;

// Manages storage and authentication of user accounts.
service Users {
  // Creates a new user account. Fails with ALREADY_EXISTS if the username
  // is already taken.
  rpc CreateUser(UserCredentials) returns (User);

  // Verifies a username/password pair and opens a new session for the
  // device named `device_name`. Fails with UNAUTHENTICATED if the
  // credentials are invalid.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Closes the session identified by the bearer token carried in the
  // call's `authorization` metadata. Fails with UNAUTHENTICATED if it
  // doesn't match an active session.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message UserCredentials {
  string username = 1;
  string password = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  // A user-facing label for the device opening this session, e.g.
  // "Pierre's iPhone".
  string device_name = 3;
}

message LoginResponse {
  User user = 1;
  // Opaque session token. The device must present it as a `Bearer` token
  // in the `authorization` metadata of subsequent authenticated calls.
  string session_token = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message User {
  string id = 1;
  string username = 2;
  int64 created_at = 3;
}
