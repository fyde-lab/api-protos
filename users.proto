syntax = "proto3";

package users;

// Manages storage and authentication of user accounts.
service Users {
  // Creates a new user account and opens a new session for it, named
  // `device_name`. Fails with ALREADY_EXISTS if the username is already
  // taken.
  rpc CreateUser(UserCredentials) returns (LoginResponse);

  // Verifies a username/password pair and opens a new session for the
  // calling device, named `device_name`. Fails with UNAUTHENTICATED if the
  // credentials are invalid.
  rpc Login(UserCredentials) returns (LoginResponse);

  // Closes the session identified by the bearer token carried in the
  // call's `authorization` metadata. Fails with UNAUTHENTICATED if it
  // doesn't match an active session.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message UserCredentials {
  string username = 1;
  string password = 2;
  // Human-readable name of the device opening the session (e.g. "Pierre's
  // iPhone"), chosen by the SDK/caller. Used to open a session for both
  // CreateUser and Login.
  string device_name = 3;
  // The user's master key, encrypted client-side. Opaque to the server:
  // only ever stored and returned as ciphertext, never inspected. Only
  // meaningful on CreateUser; ignored by Login.
  bytes encrypted_master_key = 4;
}

message LoginResponse {
  // Opaque session token. The device must present it as a `Bearer` token
  // in the `authorization` metadata of subsequent authenticated calls.
  // This is the only information the endpoint returns: no user data.
  string session_token = 1;
}

message LogoutRequest {}

message LogoutResponse {}
